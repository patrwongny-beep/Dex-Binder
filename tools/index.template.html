<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dex Binder</title>
<meta name="theme-color" content="#0d0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a collector's binder. Header = cover with completion ring and value strip; body = binder pages of nine card-shaped sleeves; detail opens as a sheet. */
:root{
  --felt:#e6e8ec; --page:#f7f8fa; --sleeve:#ffffff; --sleeve-edge:#cfd4dc; --well:#eef0f3;
  --ink:#14161b; --muted:#5a616e; --faint:#8a909b;
  --gold:#9a6408; --gold-hi:#c48a1c; --gold-soft:#f5e9cf; --on-gold:#ffffff;
  --up:#137a3f; --down:#c0392b; --scrim:rgb(10 12 16 / .5);
  --shadow:0 1px 2px rgb(20 22 27 / .06),0 6px 18px rgb(20 22 27 / .06);
  --sheen:linear-gradient(115deg,transparent 35%,rgb(255 255 255 / .55) 48%,transparent 60%);
  --f-display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --felt:#0d0f13; --page:#15181e; --sleeve:#1b1f27; --sleeve-edge:#2b313c; --well:#11141a;
  --ink:#eeeae2; --muted:#a3a8b3; --faint:#6f7582;
  --gold:#e2b04e; --gold-hi:#f3cf7e; --gold-soft:#2c2414; --on-gold:#17130a;
  --up:#4fd18b; --down:#ff7a6b; --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 22px rgb(0 0 0 / .35);
  --sheen:linear-gradient(115deg,transparent 35%,rgb(255 255 255 / .07) 48%,transparent 60%);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --felt:#0d0f13; --page:#15181e; --sleeve:#1b1f27; --sleeve-edge:#2b313c; --well:#11141a;
  --ink:#eeeae2; --muted:#a3a8b3; --faint:#6f7582;
  --gold:#e2b04e; --gold-hi:#f3cf7e; --gold-soft:#2c2414; --on-gold:#17130a;
  --up:#4fd18b; --down:#ff7a6b; --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .4),0 8px 22px rgb(0 0 0 / .35);
  --sheen:linear-gradient(115deg,transparent 35%,rgb(255 255 255 / .07) 48%,transparent 60%);
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--felt);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* cover */
header.top{background:var(--felt)}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--felt);border-bottom:1px solid var(--sleeve-edge)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 4px}
.brand{margin:0;flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{height:72px;width:auto;flex:none;display:block}
.brand .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand small{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:0}
.iconbtn{border:1px solid var(--sleeve-edge);background:var(--sleeve);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.summary{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding-block:8px 10px}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--well)}
.ring .fill{stroke:url(#foil);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .pct b{font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.ring .pct span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:2px}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.val{background:var(--sleeve);border:1px solid var(--sleeve-edge);border-radius:12px;padding:8px 9px;min-width:0}
.val > span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.val b{display:block;font-family:var(--f-mono);font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val > span small{font-size:inherit;font-weight:500;letter-spacing:.04em}
.tools{display:flex;gap:8px;padding-block:10px 8px}
.search{flex:1;min-width:0;border:1px solid var(--sleeve-edge);background:var(--sleeve);border-radius:12px;padding:0 12px;height:44px}
.seg{display:flex;border:1px solid var(--sleeve-edge);border-radius:12px;overflow:hidden;background:var(--sleeve);flex:none}
.seg button{border:0;background:none;padding:0 12px;min-height:44px;min-width:44px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--felt)}
.gens{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.gens::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--sleeve-edge);background:var(--sleeve);border-radius:999px;padding:0 14px;min-height:44px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.chip em{font-style:normal;opacity:.85;font-weight:500;margin-left:5px;font-family:var(--f-mono);font-size:12px}

/* binder pages */
main{padding-block:14px 96px}
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.page{background:var(--page);border:1px solid var(--sleeve-edge);border-radius:16px;padding:10px;box-shadow:var(--shadow)}
.page-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted)}
.page-h b{color:var(--ink);font-weight:600}
.page-h .full{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.binder.flat{display:block}
.binder.flat .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.pocket{position:relative;aspect-ratio:63/88;border-radius:9px;border:1px solid var(--sleeve-edge);background:var(--well);padding:0;overflow:hidden;display:block;width:100%;text-align:left;transition:transform .15s ease,box-shadow .15s ease}
.pocket::after{content:"";position:absolute;inset:0;background:var(--sheen);pointer-events:none}
.pocket:active{transform:scale(.97)}
@media (hover:hover){.pocket:hover{transform:translateY(-2px);box-shadow:var(--shadow)}}
.pocket .no{position:absolute;top:6px;left:7px;font-family:var(--f-mono);font-size:12px;color:var(--faint);z-index:1}
.pocket img.sp{position:absolute;left:50%;top:44%;width:86%;transform:translate(-50%,-50%);filter:brightness(0);opacity:.13}
:root[data-theme="dark"] .pocket img.sp{filter:brightness(0) invert(1);opacity:.1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pocket img.sp{filter:brightness(0) invert(1);opacity:.1}}
.pocket .nm{position:absolute;left:0;right:0;bottom:0;padding:5px 7px 6px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pocket.owned{background:radial-gradient(circle at 50% 42%,var(--gold-soft),var(--sleeve) 70%);border-color:var(--gold)}
.pocket.owned img.sp{filter:none;opacity:1;width:92%}
.pocket img.px,.sheet-head img{image-rendering:pixelated}
.sheet-head img.art{image-rendering:auto}
:root[data-theme="dark"] .pocket.owned img.sp{filter:none;opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pocket.owned img.sp{filter:none;opacity:1}}
.pocket.owned .no{color:var(--gold)}
.pocket.owned .nm{color:var(--ink);background:linear-gradient(transparent,var(--sleeve) 40%)}
.pocket.owned .nm i{display:block;font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--muted)}
.pocket.owned .nm i.up{color:var(--up)} .pocket.owned .nm i.down{color:var(--down)}
.pocket.card img.cardimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pocket.card .nm{background:linear-gradient(transparent,rgb(0 0 0 / .75) 45%);color:#fff}
.pocket.card .nm i{color:#e8e6e1!important}
.pocket.card .no{background:rgb(0 0 0 / .55);color:#fff;border-radius:6px;padding:1px 5px;top:5px;left:5px}
.rb{display:inline-flex;align-items:center;height:21px;padding:0 6px;border-radius:6px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.02em;background:var(--well);color:var(--muted);border:1px solid var(--sleeve-edge);vertical-align:middle}
.rb.hi{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--on-gold);border-color:transparent}
.pocket .rb{position:absolute;top:5px;right:5px;z-index:2}
.rsel{flex:none;max-width:46%;border:1px solid var(--sleeve-edge);background:var(--sleeve);border-radius:999px;padding:0 10px;min-height:44px;font-size:13px;font-weight:700}
.rsel.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.fab{position:fixed;z-index:15;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;min-height:54px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--felt);font-weight:800;font-size:15px;box-shadow:0 6px 20px rgb(0 0 0 / .3)}
.fab svg{width:22px;height:22px}
.scanpv{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--well)}
.readout{font-family:var(--f-mono);font-size:13px;background:var(--well);border-radius:10px;padding:8px 10px;color:var(--muted);overflow-wrap:anywhere}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--sleeve-edge);border-top-color:var(--gold);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* type colours */
.pocket{background:color-mix(in srgb,var(--t1,#888) 10%,var(--well));border-color:color-mix(in srgb,var(--t1,#888) 24%,var(--sleeve-edge))}
.pocket .types{position:absolute;right:7px;bottom:9px;display:flex;gap:3px;z-index:1}
.pocket .types b{width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px var(--page)}
.pocket.owned{background:radial-gradient(120% 85% at 50% 32%,color-mix(in srgb,var(--t1) 30%,#fff) 0%,var(--t1) 52%,color-mix(in srgb,var(--t2) 80%,#000) 118%);border:1.5px solid color-mix(in srgb,var(--t1) 60%,#fff);box-shadow:0 6px 16px color-mix(in srgb,var(--t1) 38%,transparent)}
.pocket.owned .types{display:none}
.pocket.owned .no{color:#fff;background:rgb(0 0 0 / .35);border-radius:6px;padding:1px 5px;top:5px;left:5px}
.pocket.owned .nm{color:#fff;background:linear-gradient(transparent,rgb(0 0 0 / .62) 42%);padding-top:14px}
.pocket.owned .nm i{display:table;margin-top:3px;padding:1px 6px;border-radius:6px;background:rgb(0 0 0 / .4);color:#f1efe9}
.pocket.owned .nm i.up{color:#9ff0c2} .pocket.owned .nm i.down{color:#ffb3a7}
.pocket.owned::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgb(255 255 255 / .55),transparent 45%);pointer-events:none}
.binder .pocket.owned img.sp{filter:drop-shadow(0 6px 6px rgb(0 0 0 / .28));opacity:1}
.pocket.owned .rb:not(.hi){background:rgb(0 0 0 / .4);color:#fff;border-color:transparent}
.sheet-head.typed{background:linear-gradient(135deg,color-mix(in srgb,var(--t1) 55%,#000),color-mix(in srgb,var(--t2) 45%,#000));color:#fff;border-bottom:0;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-radius:20px 20px 0 0}
.sheet:has(.sheet-head.typed) .grab{background:rgb(255 255 255 / .55)}
.sheet-head.typed img{width:76px;height:76px;filter:drop-shadow(0 6px 8px rgb(0 0 0 / .3));object-fit:contain}
.sheet-head.typed h2 small{color:#fff;opacity:.92}
.sheet-head.typed .iconbtn{background:rgb(0 0 0 / .25);border-color:transparent;color:#fff}
.tchips{display:flex;gap:5px;margin-top:6px;font-stretch:100%}
.tchip{font-family:var(--f-body);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc) 55%,#000);box-shadow:inset 0 0 0 1.5px var(--tc)}
/* motion */
.sheet:not([hidden]){animation:sheetUp .42s cubic-bezier(.2,.9,.25,1.06)}
.scrim:not([hidden]){animation:fade .25s ease}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.binder.intro .page{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.pocket.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg)}60%{transform:scale(1.08) rotate(2deg)}100%{transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
.seg3{display:flex;border:1px solid var(--sleeve-edge);border-radius:12px;overflow:hidden;background:var(--sleeve)}
.seg3 button{flex:1;border:0;background:none;min-height:44px;font-weight:700;color:var(--muted)}
.seg3 button[aria-pressed=true]{background:var(--gold);color:var(--on-gold)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.page,.pocket.pop{animation:none!important}}
/* views */
body[data-view="shelf"] .sticky,body[data-view="shelf"] .fab{display:none}
body[data-view="binder"] .seg,body[data-view="binder"] .chip{display:none}
.brand span:not(.vh){display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:14px}
.shelf h2{grid-column:1/-1;margin:4px 0 -2px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-family:var(--f-mono);font-weight:600}
.cover{position:relative;aspect-ratio:4/5;border:0;border-radius:16px;padding:14px 14px 12px 22px;text-align:left;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--bc) 78%,#fff) 0%,var(--bc) 38%,color-mix(in srgb,var(--bc) 50%,#000) 100%);box-shadow:0 10px 24px color-mix(in srgb,var(--bc) 35%,transparent),inset 0 0 0 1px rgb(255 255 255 / .18);transition:transform .18s ease}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:rgb(0 0 0 / .28);box-shadow:inset -2px 0 0 rgb(255 255 255 / .15)}
.cover::after{content:"";position:absolute;inset:0;background:var(--sheen);pointer-events:none}
.cover:active{transform:scale(.97)}
@media (hover:hover){.cover:hover{transform:translateY(-3px)}}
.cover .fan{position:absolute;left:50%;top:7%;width:42%;aspect-ratio:63/88;translate:-42% 0}
.cover .fan i{position:absolute;inset:0;border-radius:6px;background:rgb(255 255 255 / .16) center/cover no-repeat;box-shadow:0 4px 10px rgb(0 0 0 / .3);border:1.5px solid rgb(255 255 255 / .5)}
.cover .fan i:nth-child(1){rotate:-12deg;translate:-22% 4%}
.cover .fan i:nth-child(2){rotate:-2deg}
.cover .fan i:nth-child(3){rotate:9deg;translate:22% 3%}
.cover .fan i.sp{background-size:88%;background-color:rgb(255 255 255 / .22)}
.cover .fan i.px{image-rendering:pixelated}
.cover b{position:relative;z-index:1;font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:17px;line-height:1.15;text-shadow:0 1px 2px rgb(0 0 0 / .35);text-wrap:balance;overflow-wrap:anywhere}
.cover span{position:relative;z-index:1;font-family:var(--f-mono);font-size:12px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px}
.cover span em{font-style:normal;background:rgb(0 0 0 / .32);padding:1px 6px;border-radius:6px}
.cover .meter{position:relative;z-index:1;height:6px;border-radius:3px;background:rgb(0 0 0 / .3);overflow:hidden}
.cover .meter i{display:block;height:100%;background:#fff}
.cover.add{background:transparent;border:2px dashed var(--sleeve-edge);color:var(--muted);box-shadow:none;align-items:center;justify-content:center;padding:14px}
.cover.add::before,.cover.add::after{display:none}
.cover.add b{color:var(--ink);text-shadow:none;font-size:15px;text-align:center}
.cover.add svg{width:34px;height:34px;color:var(--gold)}
.pocket.addcard{border:2px dashed var(--sleeve-edge);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:13px;text-align:center}
.pocket.addcard::after{display:none}
.pocket.addcard svg{width:28px;height:28px;color:var(--gold)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatches label{position:relative;width:44px;height:44px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .15)}
.swatches input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.swatches input:checked+span{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--ink)}
.swatches input:focus-visible+span{outline:2px solid var(--gold);outline-offset:3px}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--page);border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));box-shadow:0 -10px 34px rgb(0 0 0 / .25)}
@media (min-width:700px){.sheet{left:50%;translate:-50% 0;width:640px;bottom:24px;border-radius:20px}}
.grab{position:absolute;top:6px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--sleeve-edge);z-index:3}
.sheet-head.typed~*{}
.sheet-head{position:sticky;top:0;background:var(--page);display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--sleeve-edge);z-index:1}
.sheet-head img{width:60px;height:60px;image-rendering:pixelated}
.sheet-head h2:focus{outline:none}
.sheet-head h2{font-family:var(--f-display);font-weight:800;font-stretch:112%;font-size:22px;margin:0;line-height:1.1;flex:1;min-width:0;text-wrap:balance}
.sheet-head h2 small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--gold);font-weight:500;letter-spacing:.06em;font-stretch:100%}
.sheet-body{padding-block:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--sleeve-edge);background:var(--sleeve);border-radius:12px;min-height:46px;padding:0 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.danger{color:var(--down)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea,.field select{border:1px solid var(--sleeve-edge);background:var(--sleeve);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.res{border:1px solid var(--sleeve-edge);background:var(--sleeve);border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.res img{aspect-ratio:63/88;width:100%;object-fit:cover;border-radius:7px;background:var(--well)}
.res b{font-size:13px;line-height:1.25}
.res span{font-size:12px;color:var(--muted);line-height:1.35}
.res .mk{font-family:var(--f-mono);font-size:12.5px;color:var(--gold);font-weight:600}
.status{font-size:14px;color:var(--muted);margin:0}
.filled{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.filled figure{margin:0;display:flex;flex-direction:column;gap:6px}
.filled img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:10px;background:var(--well);border:1px solid var(--sleeve-edge)}
.noimg{aspect-ratio:63/88;border-radius:10px;border:1px dashed var(--sleeve-edge);background:var(--well);display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;padding:10px}
dl.facts{display:grid;grid-template-columns:6em minmax(0,1fr);gap:7px 12px;margin:0}
dl.facts dt{color:var(--muted);font-size:14px}
dl.facts dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.confirm{border:1px solid var(--down);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1 1 160px}
.stat-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--sleeve);border:1px solid var(--sleeve-edge);border-radius:12px;padding:12px}
.tile b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.tile b span{font-size:inherit}
.up,.tile b .up{color:var(--up)} .down,.tile b .down{color:var(--down)}
.genrow{display:grid;grid-template-columns:64px 1fr 96px;align-items:center;gap:10px;font-size:13.5px;font-variant-numeric:tabular-nums}
.genrow .bar2{height:8px;background:var(--well);border-radius:4px;overflow:hidden}
.genrow .bar2 i{display:block;height:100%;background:var(--gold)}
.genrow span:last-child{text-align:right;color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.note{font-size:14px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--felt);padding:11px 16px;border-radius:12px;z-index:40;font-weight:600;width:max-content;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header class="top">
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--gold-hi)"/><stop offset=".55" style="stop-color:var(--gold)"/><stop offset="1" style="stop-color:var(--gold-hi)"/></linearGradient></defs></svg>

</header>
<nav class="sticky" aria-label="Find and filter">
  <div class="wrap">

      <input class="search" id="q" type="search" placeholder="Name or number" autocomplete="off" aria-label="Search Pokémon">
      <div class="seg" role="group" aria-label="Show">
        <button data-f="all" aria-pressed="true">All</button>
        <button data-f="have" aria-pressed="false">Have</button>
        <button data-f="need" aria-pressed="false">Need</button>
      </div>
    </div>
    <div class="gens"><select class="rsel" id="rfilter" aria-label="Filter by rarity"><option value="">All rarities</option></select><div id="gens" style="display:contents"></div></div>
  </div>
</nav>

<main class="wrap"><div class="binder" id="grid"></div><p class="empty" id="none" hidden>Nothing matches that filter.</p></main>

<button class="fab" id="scanBtn" aria-label="Scan a card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="7" width="8" height="10" rx="1.5"/></svg>Scan card</button>

hmdofofofn-qnpepfpipboprggodocoekeoenenhghkhre-qoeobodomkqka-hn";
const TYPE_NAMES=["Normal","Fire","Water","Electric","Grass","Ice","Fighting","Poison","Ground","Flying","Psychic","Bug","Rock","Ghost","Dragon","Dark","Steel","Fairy"];
const TYPE_COL=["#a8a77a","#ee8130","#6390f0","#f2c218","#7ac74c","#68c9c4","#c22e28","#a33ea1","#d9a94a","#a98ff3","#f95587","#a6b91a","#b6a136","#735797","#6f35fc","#705746","#9ea0b8","#d685ad"];
const typesOf=n=>{const a=TYPES.charCodeAt((n-1)*2)-97,b=TYPES[(n-1)*2+1];return b==="-"?[a]:[a,b.charCodeAt(0)-97];};
const tvars=n=>{const t=typesOf(n);return `--t1:${TYPE_COL[t[0]]};--t2:${TYPE_COL[t[1]??t[0]]}`;};
const SPRITE=n=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${n}.png`;
const PIXEL=false;
const ART=n=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${n}.png`;
const pad=n=>String(n).padStart(4,"0");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- storage (IndexedDB, on this phone only) ---------- */
let dbp;
function db(){ if(!dbp) dbp=new Promise((res,rej)=>{const r=indexedDB.open("dexbinder",2);
  r.onupgradeneeded=()=>{const d=r.result,has=n=>d.objectStoreNames.contains(n);
    if(!has("entries"))d.createObjectStore("entries",{keyPath:"dex"}); if(!has("photos"))d.createObjectStore("photos"); if(!has("meta"))d.createObjectStore("meta");
    if(!has("binders"))d.createObjectStore("binders",{keyPath:"id"}); if(!has("items"))d.createObjectStore("items",{keyPath:"id"});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); return dbp;}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out instanceof IDBRequest?out.result:out);t.onerror=()=>rej(t.error);});}
const getAll=st=>tx(st,"readonly",s=>s.getAll());
const put=(st,v,k)=>tx(st,"readwrite",s=>k===undefined?s.put(v):s.put(v,k));
const del=(st,k)=>tx(st,"readwrite",s=>s.delete(k));
const get=(st,k)=>tx(st,"readonly",s=>s.get(k));
async function getAllKV(st){const d=await db();return new Promise((res,rej)=>{const out={};const t=d.transaction(st);const c=t.objectStore(st).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue();}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);});}

let entries=new Map(); let settings={currency:"RM",lastBackup:null};
let filter="all", gen=0, query="", rfilter="";
let binders=new Map(), items=new Map(), view="shelf";
const DEMO_TAG="";
const BCOLORS=[["Gold","#b8860b"],["Crimson","#b3263a"],["Cobalt","#2856c9"],["Emerald","#18865a"],["Violet","#6b3fc7"],["Teal","#11808a"],["Graphite","#3d4350"],["Rose","#c2477d"],["Orange","#d4631c"],["Coral","#e0604e"],["Sky","#2b8fd6"],["Navy","#1f3a73"],["Forest","#2f6b2a"],["Plum","#7d2f6b"],["Bronze","#8a5a2b"],["Silver","#8a929e"]];
const DEX_COLOR=()=>settings.dexColor||BCOLORS[0][1];
const swatchHTML=col=>`<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">Cover colour</legend><div class="swatches">${BCOLORS.map(([n,c])=>`<label style="background:${c}" title="${n}"><input type="radio" name="bcol" value="${c}" aria-label="${n}" ${c===col?"checked":""}><span></span></label>`).join("")}</div></fieldset>`;
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const itemsIn=id=>[...items.values()].filter(i=>i.binder===id).sort((a,b)=>a.added-b.added);
const curBinder=()=>view.startsWith("b:")?binders.get(view.slice(2)):null;

async function load(){
  try{ (await getAll("entries")).forEach(e=>entries.set(e.dex,e));
       (await getAll("binders")).forEach(b=>binders.set(b.id,b)); (await getAll("items")).forEach(i=>items.set(i.id,i));
       const s=await get("meta","settings"); if(s) settings={...settings,...s}; if(settings.theme) applyTheme(settings.theme); }catch(e){ toast("Couldn't open storage on this device."); }
  if(navigator.storage&&navigator.storage.persist){ try{ await navigator.storage.persist(); }catch(e){} }
  history.replaceState({view:"shelf"},""); setView("shelf",true);
  if(navigator.onLine && Date.now()-(settings.pricesUpdated||0) > 20*3600*1000) refreshPrices(false);
}
const fmt=v=>Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>v==null||v===""?"—":`RM ${fmt(v)}`;
const usd=v=>v==null?"—":`US$ ${fmt(v)}`;

/* ---------- market value (TCGplayer USD → RM) ---------- */
const VARIANT_NAMES={normal:"Normal",holofoil:"Holo",reverseHolofoil:"Reverse holo","1stEditionHolofoil":"1st Edition holo","1stEditionNormal":"1st Edition",unlimitedHolofoil:"Unlimited holo"};
const vName=k=>VARIANT_NAMES[k]||k;
const usdOf=(pr,v)=>{const p=pr&&v&&pr[v];return p?(p.market??p.mid??null):null;};
function variants(pr){return pr?Object.keys(pr).filter(k=>usdOf(pr,k)!=null):[];}
function pickVariant(pr,pref){const ks=variants(pr);if(!ks.length)return null;if(pref&&ks.includes(pref))return pref;for(const k of ["holofoil","normal","reverseHolofoil","1stEditionHolofoil"]) if(ks.includes(k)) return k;return ks[0];}
const RARITY=[["Common","C"],["Uncommon","U"],["Rare","R"],["Rare Holo","RH"],["Double Rare","RR"],["Rare Holo EX","EX"],["Rare Holo GX","GX"],["Rare Holo V","V"],["Rare Holo VMAX","VMAX"],["Rare Holo VSTAR","VSTAR"],["Rare Ultra","FA"],["Ultra Rare","UR"],["Illustration Rare","IR"],["Special Illustration Rare","SIR"],["Hyper Rare","HR"],["Rare Secret","SR"],["Rare Rainbow","RNB"],["Rare Shiny","SH"],["Shiny Rare","SHR"],["Shiny Ultra Rare","SUR"],["Rare Shiny GX","SGX"],["Trainer Gallery Rare Holo","TG"],["Amazing Rare","AR"],["Radiant Rare","RAD"],["Rare Prism Star","PS"],["Rare BREAK","BRK"],["Rare Holo LV.X","LVX"],["ACE SPEC Rare","ACE"],["Promo","PR"]];
const RCODE=Object.fromEntries(RARITY);
const RLABEL={"Rare Ultra":"Ultra Rare (Full Art)","Rare Secret":"Secret Rare","Rare Rainbow":"Rainbow Rare","Rare Holo":"Holo Rare"};
const rLabel=r=>RLABEL[r]||r;
const rCode=r=>r?(RCODE[r]||r.replace(/[^A-Z]/g,"").slice(0,4)||r.slice(0,3).toUpperCase()):"";
const HIGH=new Set(["IR","SIR","HR","SR","RNB","FA","UR","SHR","SUR","SGX","TG","AR","RAD","GX","VMAX","VSTAR","ACE"]);
const badge=r=>r?`<span class="rb${HIGH.has(rCode(r))?" hi":""}" title="${esc(rLabel(r))}">${esc(rCode(r))}</span>`:"";
const rate=()=>settings.rateOverride||settings.usdMyr||null;
const toRM=u=>u!=null&&rate()?Math.round(u*rate()*100)/100:null;
const marketOf=e=>toRM(e.usd);
const valueOf=e=>e.myValue!=null?e.myValue:marketOf(e);
function gainHtml(paid,val){
  if(paid==null||val==null) return "—";
  const d=Math.round((val-paid)*100)/100, sign=d>0?"+":d<0?"−":"", cls=d>0?"up":d<0?"down":"";
  const pct=paid>0?` (${sign}${Math.abs(d/paid*100).toFixed(1)}%)`:"";
  return `<span class="${cls}">${sign}RM ${fmt(Math.abs(d))}${pct}</span>`;
}
async function refreshRate(){
  const save=async v=>{settings.usdMyr=v;settings.rateUpdated=Date.now();await put("meta",settings,"settings");return true;};
  try{const j=await (await fetch("https://open.er-api.com/v6/latest/USD")).json(); if(j.rates&&j.rates.MYR) return save(j.rates.MYR);}catch(_){}
  try{const j=await (await fetch("https://api.frankfurter.app/latest?from=USD&to=MYR")).json(); if(j.rates&&j.rates.MYR) return save(j.rates.MYR);}catch(_){}
  return false;
}
let refreshing=false;
async function refreshPrices(manual){
  if(refreshing) return; refreshing=true;
  const rateOk=await refreshRate();
  const list=[...entries.values(),...items.values()].filter(e=>(e.binder?e.cardId:e.id)&&e.src!=="tcgdex");
  const cid=e=>e.binder?e.cardId:e.id;
  let updated=0, failed=false;
  for(let i=0;i<list.length;i+=40){
    const chunk=list.slice(i,i+40);
    const q="("+chunk.map(e=>`id:"${cid(e)}"`).join(" OR ")+")";
    try{
      const r=await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=250&select=id,tcgplayer`);
      if(!r.ok) throw 0; const j=await r.json(); const byId=new Map(j.data.map(c=>[c.id,c]));
      for(const e of chunk){const c=byId.get(cid(e)); if(!c) continue; const pr=c.tcgplayer?.prices||null;
        e.prices=pr; e.variant=pickVariant(pr,e.variant); e.usd=usdOf(pr,e.variant); e.priceUpdated=Date.now();
        await put(e.binder?"items":"entries",e); updated++;}
    }catch(_){failed=true;}
  }
  if(!failed){settings.pricesUpdated=Date.now(); await put("meta",settings,"settings");}
  refreshing=false; render();
  if(manual) toast(failed?"Some prices couldn't be updated. Check your connection and try again.":`Updated ${updated} market price${updated===1?"":"s"}${rateOk?"":" · exchange rate unchanged"}`);
  if(!$("#sheet").hidden && $("#statsMark")) showStats();
}

document.addEventListener("keydown",e=>{const l=e.target.closest&&e.target.closest("label.btn");if(l&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const i=l.querySelector("input");if(i)i.click();}});
/* ---------- appearance ---------- */
function applyTheme(t){const r=document.documentElement; if(t==="light"||t==="dark") r.setAttribute("data-theme",t); else r.removeAttribute("data-theme");
  try{localStorage.setItem("dexbinder-theme",t||"auto");}catch(_){}
  const m=document.querySelector('meta[name="theme-color"]'); if(m){const dark=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches); m.content=dark?"#0d0f13":"#e6e8ec";}}
try{applyTheme(localStorage.getItem("dexbinder-theme")||"auto");}catch(_){}

/* ---------- celebration ---------- */
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(colors,big){
  if(reduceMotion()) return;
  const c=$("#fx"),g=c.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;g.scale(dpr,dpr);
  const N=big?180:80, ps=[];
  for(let i=0;i<N;i++){const a=-Math.PI/2+(Math.random()-.5)*(big?2.4:1.6),v=(big?9:7)+Math.random()*6;

const mapTcg=c=>({id:c.id,cardName:c.name,number:`${c.number}/${c.set.printedTotal??"?"}`,set:c.set.name,series:c.set.series,rarity:c.rarity||"",released:c.set.releaseDate||"",img:c.images?.small||"",imgLarge:c.images?.large||"",src:"pokemontcg",prices:c.tcgplayer?.prices||null,priceUpdated:Date.now(),dexNums:c.nationalPokedexNumbers||[]});
const cardCache=new Map();
async function searchCards(n){
  if(cardCache.has(n)) return cardCache.get(n);
  let out=[];
  try{
    const r=await fetch(`https://api.pokemontcg.io/v2/cards?q=nationalPokedexNumbers:${n}&orderBy=-set.releaseDate&pageSize=250&select=id,name,number,rarity,set,images,tcgplayer,nationalPokedexNumbers`);
    if(!r.ok) throw 0; const j=await r.json();
    out=j.data.map(mapTcg);
    if(Date.now()-(settings.rateUpdated||0)>12*3600*1000) await refreshRate();
  }catch(_){
    const r=await fetch(`https://api.tcgdex.net/v2/en/cards?dexId=eq:${n}`);
    if(!r.ok) throw new Error("search failed"); const j=await r.json();
    out=j.map(c=>{const setId=c.id.slice(0,c.id.lastIndexOf("-"));return {id:c.id,cardName:c.name,number:c.localId,set:setId,series:"",rarity:"",released:"",img:c.image?c.image+"/low.webp":"",imgLarge:c.image?c.image+"/high.webp":"",src:"tcgdex"};}).reverse();
  }
  cardCache.set(n,out); return out;
}

async function shrink(file){
  const bmp=await createImageBitmap(file).catch(()=>null); if(!bmp) return file;
  const max=1400, k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.85));
}

/* ---------- scan a card (text recognition on the phone) ---------- */
let ocrWorker=null;
const OCR_FAIL="Text recognition isn't available right now (it needs internet the first time). Type the card number below.";
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const t=document.createElement("script");t.src=src;t.onload=res;t.onerror=()=>rej(new Error("load"));document.head.appendChild(t);});}
async function getOcr(){
  if(ocrWorker) return ocrWorker;
  await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
  ocrWorker=await Promise.race([Tesseract.createWorker("eng"),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),45000))]);
  return ocrWorker;
}
function crop(bmp,x,y,w,h,scale){const c=document.createElement("canvas");c.width=Math.round(w*scale);c.height=Math.round(h*scale);const g=c.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(bmp,x,y,w,h,0,0,c.width,c.height);return c;}
const NAMES=SPECIES.map(([nm],i)=>({n:i+1,k:nm.toUpperCase().replace(/[^A-Z0-9]/g,"")})).filter(x=>x.k.length>=3).sort((a,b)=>b.k.length-a.k.length);
function parseScan(text){
  const T=text.toUpperCase().replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,"0");
  let num=null,total=null;
  const re=/\b([A-Z]{0,4}\d{1,3})\s*[\/|\\]\s*([A-Z]{0,3}\d{2,3})\b/g; let m, best=null;
  while((m=re.exec(T))){const t=parseInt(m[2].replace(/\D/g,""),10); if(t>=10&&t<=400){best=m;break;}}
  if(best){num=best[1];total=best[2];}
  const flat=T.replace(/[^A-Z0-9]/g,"");
  const hit=NAMES.find(x=>flat.includes(x.k));
  return {num,total,dex:hit?hit.n:null};
}
async function readCard(blob,onStep){
  const bmp=await createImageBitmap(blob); const W=bmp.width,H=bmp.height;
  const w=await getOcr(); onStep("Reading the card…");
  const k=Math.min(1,1600/Math.max(W,H));
  const full=await w.recognize(crop(bmp,0,0,W,H,k));
  onStep("Reading the card number…");
  const strip=await w.recognize(crop(bmp,0,Math.round(H*.8),W,Math.round(H*.2),Math.min(2.5,2400/W)));
  const text=full.data.text+"\n"+strip.data.text;
  const a=parseScan(strip.data.text), b=parseScan(text);
  return {text:text.replace(/\s+/g," ").trim().slice(0,240), num:a.num||b.num, total:a.total||b.total, dex:b.dex};
}
async function lookupScan({num,total,dex}){
  const clean=String(num).toUpperCase().replace(/^([A-Z]*)0+(\d)/,"$1$2");
  const tot=total?String(total).toUpperCase().replace(/^([A-Z]*)0+(\d)/,"$1$2"):null;
  const go=async q=>{const r=await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent(q)}&pageSize=60&orderBy=-set.releaseDate&select=id,name,number,rarity,set,images,tcgplayer,nationalPokedexNumbers`);if(!r.ok)throw new Error("lookup");return (await r.json()).data;};
  let list=dex?await go(`number:"${clean}" nationalPokedexNumbers:${dex}`):[];
  if(!list.length) list=await go(`number:"${clean}"`);
  {const f=list.filter(c=>String(c.number).toUpperCase()===clean); if(f.length) list=f;}
  if(tot){const t=tot.replace(/\D/g,""), pre=tot.replace(/\d/g,"");
    const f=list.filter(c=>pre?String(c.number).toUpperCase().startsWith(pre)||c.set.printedTotal==t:c.set.printedTotal==t);
    if(f.length) list=f;}
  if(dex){const f=list.filter(c=>(c.nationalPokedexNumbers||[]).includes(dex)); if(f.length) list=f;}
  if(Date.now()-(settings.rateUpdated||0)>12*3600*1000) await refreshRate();
  return list.map(mapTcg);
}

function addToBinder(binderId,replaceId){
  const b=binders.get(binderId);
  openSheet(`<div class="sheet-head"><h2 id="sheetTitle"><small>${esc(b.name.toUpperCase())}</small>${replaceId?"Replace card":"Add a card"}</h2>${closeBtn}</div><div class="sheet-body">
    <form id="nsf" class="field"><label class="label" for="ns">Search cards</label>
      <div class="tools" style="padding:0"><input class="search" id="ns" type="search" placeholder="Pokémon or card name, or 199/165" autocomplete="off"><button class="btn primary" type="submit">Search</button></div></form>
    <p class="status" id="nst" hidden></p>
    <div class="results" id="nres"></div>
    <div class="row">${replaceId?"":`<button class="btn" data-act="scan">Scan a card</button>`}<button class="btn" data-act="manual">Enter by hand</button></div>
  </div>`);
  setTimeout(()=>$("#ns")&&$("#ns").focus(),350);
  let list=[];
  const st=(m,busy)=>{$("#nst").hidden=!m;$("#nst").innerHTML=(busy?'<span class="spin"></span>':"")+esc(m||"");};
  $("#nsf").addEventListener("submit",async ev=>{ev.preventDefault();const t=$("#ns").value;if(!t.trim())return;
    st(`Searching for "${t.trim()}"…`,true); $("#nres").innerHTML="";
    try{list=await nameSearch(t);}catch(_){return st("Couldn't reach the card database. Check your connection, or enter the card by hand.");}
    st(list.length?`${list.length} card${list.length===1?"":"s"} found. Tap yours.`:"No cards found. Try a shorter name, or enter it by hand.");
    $("#nres").innerHTML=list.map(c=>`<button class="res" data-id="${esc(c.id)}"><img loading="lazy" src="${esc(c.img)}" alt=""><b>${esc(c.cardName)}</b><span>${esc(c.set)} · ${esc(c.number)}${c.rarity?`<br>${badge(c.rarity)} ${esc(rLabel(c.rarity))}`:""}</span>${(()=>{const u=usdOf(c.prices,pickVariant(c.prices));return u!=null?`<span class="mk">${toRM(u)!=null?money(toRM(u)):usd(u)}</span>`:"";})()}</button>`).join("");});
  $("#sheet").onclick=ev=>{const a=ev.target.closest("[data-act]");
    if(a&&a.dataset.act==="close") return closeSheet();
    if(a&&a.dataset.act==="scan") return showScan();
    if(a&&a.dataset.act==="manual"){const prev=replaceId?items.get(replaceId):{};return showItemForm({price:prev.price,notes:prev.notes,added:prev.added},{binderId,itemId:replaceId,manual:true});}
    const r=ev.target.closest(".res"); if(!r) return; const c=list.find(x=>x.id===r.dataset.id); if(!c) return;
    const prev=replaceId?items.get(replaceId):{};
    showItemForm({...c,price:prev.price,notes:prev.notes,added:prev.added,myValue:null},{binderId,itemId:replaceId});};
}
async function showItem(id){
  const it=items.get(id); if(!it) return closeSheet();
  let photo=""; try{const b=await get("photos","i:"+id); if(b){const u=URL.createObjectURL(b);urls.push(u);photo=u;}}catch(_){}
  openSheet(itemHead(it,(binders.get(it.binder)||{name:""}).name.toUpperCase())+`<div class="sheet-body">
    <div class="filled">
      <figure><div class="label">Card</div>${it.img?`<img src="${esc(it.img)}" alt="${esc(it.cardName)} card">`:`<div class="noimg">No database image</div>`}</figure>
      <figure><div class="label">My copy</div>${photo?`<img src="${photo}" alt="Your photo of the card">`:`<div class="noimg">No photo yet</div>`}</figure>
    </div>
    <dl class="facts">
      <dt>Set</dt><dd>${esc(it.set)}${it.series?` <span class="note">(${esc(it.series)})</span>`:""}</dd>
      <dt>Number</dt><dd>${esc(it.number)}</dd>
      ${it.rarity?`<dt>Rarity</dt><dd>${badge(it.rarity)} ${esc(rLabel(it.rarity))}</dd>`:""}
    </dl>
    <div class="label">Value</div>
    <dl class="facts">
      <dt>Price paid</dt><dd>${money(it.price)}</dd>
      <dt>Market</dt><dd>${marketOf(it)!=null?`${money(marketOf(it))} <span class="note">· ${usd(it.usd)} TCGplayer${it.variant?`, ${esc(vName(it.variant))}`:""}</span>`:`— <span class="note">${it.cardId?"no TCGplayer price":"enter your own value"}</span>`}</dd>
      ${it.myValue!=null?`<dt>My value</dt><dd>${money(it.myValue)} <span class="note">· used instead of market</span></dd>`:""}
      <dt>Gain/loss</dt><dd>${gainHtml(it.price,valueOf(it))}</dd>
      <dt>Added</dt><dd>${new Date(it.added).toLocaleDateString()}</dd>
      ${it.notes?`<dt>Notes</dt><dd>${esc(it.notes)}</dd>`:""}
    </dl>
    <div class="row"><button class="btn" data-act="edit">Edit details</button><button class="btn" data-act="replace">Replace card</button></div>
    <div id="rm"><button class="btn danger" data-act="remove" style="width:100%">Remove from binder</button></div>
  </div>`);
  $("#sheet").onclick=async ev=>{const a=ev.target.closest("[data-act]");if(!a)return;
    if(a.dataset.act==="close") closeSheet();
    if(a.dataset.act==="edit") showItemForm(it,{binderId:it.binder,itemId:it.id,manual:!it.cardId,editing:true});
    if(a.dataset.act==="replace") addToBinder(it.binder,it.id);
    if(a.dataset.act==="remove") $("#rm").innerHTML=`<div class="confirm"><p>Remove ${esc(it.cardName)} from this binder? Its photo is removed too.</p><button class="btn" data-act="keep">Keep</button><button class="btn primary" data-act="yesrm">Remove</button></div>`;
    if(a.dataset.act==="keep") showItem(id);
    if(a.dataset.act==="yesrm"){await del("items",id);await del("photos","i:"+id);items.delete(id);renderGens();render();closeSheet();toast("Removed from binder");}
  };
}
async function showItemForm(e,{binderId,itemId,manual,editing,scanPhoto}={}){
  let existing=null; if(itemId){try{existing=await get("photos","i:"+itemId);}catch(_){}}
  if(scanPhoto) existing=scanPhoto;
  let preview=""; if(existing){const u=URL.createObjectURL(existing);urls.push(u);preview=u;}
  const b=binders.get(binderId);
  openSheet(itemHead(e,b.name.toUpperCase())+`<form class="sheet-body" id="f">
    ${manual?`<div class="field"><label class="label" for="fn">Card name</label><input id="fn" required value="${esc(e.cardName||"")}"></div>
    <div class="two"><div class="field"><label class="label" for="fs">Set</label><input id="fs" required value="${esc(e.set||"")}"></div>
    <div class="field"><label class="label" for="fnum">Number</label><input id="fnum" required placeholder="e.g. 58/102" value="${esc(e.number||"")}"></div></div>
    <div class="field"><label class="label" for="fpk">Pokémon (for colour, optional)</label><input id="fpk" list="pklist" autocomplete="off" value="${esc((()=>{const d=(e.dexNums||[])[0];return d?SPECIES[d-1][0]:"";})())}"><datalist id="pklist">${SPECIES.map(([n])=>`<option value="${esc(n)}">`).join("")}</datalist></div>
    <div class="field"><label class="label" for="frar">Rarity</label><select id="frar"><option value="">Not set</option>${RARITY.map(([r,c])=>`<option value="${esc(r)}" ${r===e.rarity?"selected":""}>${esc(c)} · ${esc(rLabel(r))}</option>`).join("")}</select></div>`
    :`<div class="filled"><figure>${e.img?`<img src="${esc(e.img)}" alt="">`:`<div class="noimg">No image</div>`}</figure>
      <dl class="facts" style="align-content:start"><dt>Set</dt><dd>${esc(e.set)}</dd><dt>No.</dt><dd>${esc(e.number)}</dd>${e.rarity?`<dt>Rarity</dt><dd>${badge(e.rarity)} ${esc(rLabel(e.rarity))}</dd>`:""}</dl></div>`}
    ${!manual&&variants(e.prices).length?`<div class="field"><label class="label" for="fv">Printing (sets the market price)</label><select id="fv">${variants(e.prices).map(k=>`<option value="${esc(k)}" ${k===pickVariant(e.prices,e.variant)?"selected":""}>${esc(vName(k))} · ${usd(usdOf(e.prices,k))}${toRM(usdOf(e.prices,k))!=null?` ≈ ${money(toRM(usdOf(e.prices,k)))}`:""}</option>`).join("")}</select></div>`:""}
    <div class="two">
      <div class="field"><label class="label" for="fp">Price paid (RM)</label><input id="fp" type="number" inputmode="decimal" step="0.01" min="0" value="${e.price??""}"></div>
      <div class="field"><label class="label" for="fmv">My value (RM)</label><input id="fmv" type="number" inputmode="decimal" step="0.01" min="0" placeholder="${!manual&&variants(e.prices).length?"Use market":"Optional"}" value="${e.myValue??""}"></div>
    </div>
    <div class="field"><span class="label">Photo of my card</span>
      <div class="row"><label class="btn" tabindex="0">Take photo<input id="fcam" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn" tabindex="0">From gallery<input id="fgal" type="file" accept="image/*" hidden></label></div>
      <img id="pv" src="${preview}" alt="Photo preview" style="max-height:240px;object-fit:contain;border-radius:10px" ${preview?"":"hidden"}>
    </div>
    <div class="field"><label class="label" for="fnotes">Notes</label><textarea id="fnotes" rows="2" placeholder="Condition, where you bought it…">${esc(e.notes||"")}</textarea></div>
    <div class="row"><button type="button" class="btn" data-act="back">Back</button><button type="submit" class="btn primary">${itemId?"Save":"Add to binder"}</button></div>
  </form>`);
  let newPhoto=scanPhoto||null;
  const pick=async ev=>{const f=ev.target.files[0];if(!f)return;newPhoto=await shrink(f);const u=URL.createObjectURL(newPhoto);urls.push(u);$("#pv").src=u;$("#pv").hidden=false;};
  $("#fcam").addEventListener("change",pick); $("#fgal").addEventListener("change",pick);
  $("#sheet").onclick=ev=>{const a=ev.target.closest("[data-act]");if(!a)return;
    if(a.dataset.act==="close") closeSheet();
    if(a.dataset.act==="back") scanPhoto?showScan(scanPhoto):editing?showItem(itemId):addToBinder(binderId,itemId);};
  $("#f").addEventListener("submit",async ev=>{ev.preventDefault();
    const num=v=>v===""?null:Math.round(parseFloat(v)*100)/100;
    const id=itemId||newId("i");
    let dexNums=e.dexNums||[];
    if(manual){const nm=$("#fpk").value.trim().toLowerCase();const hit=SPECIES.findIndex(([x])=>x.toLowerCase()===nm);dexNums=hit>=0?[hit+1]:[];}
    const rec={id,binder:binderId,id_:undefined,cardName:manual?$("#fn").value.trim():e.cardName,set:manual?$("#fs").value.trim():e.set,
      number:manual?$("#fnum").value.trim():e.number,series:manual?"":e.series||"",rarity:manual?$("#frar").value:e.rarity||"",
      img:manual?"":e.img||"",price:num($("#fp").value),myValue:num($("#fmv").value),notes:$("#fnotes").value.trim(),
      added:e.added||Date.now(),src:manual?"manual":(e.src||"pokemontcg"),dexNums};
    delete rec.id_;
    rec.cardId=manual?null:(e.binder?e.cardId:(e.id||null));
    if(!manual&&e.prices){rec.prices=e.prices;rec.variant=$("#fv")?$("#fv").value:pickVariant(e.prices,e.variant);rec.usd=usdOf(e.prices,rec.variant);rec.priceUpdated=e.priceUpdated||Date.now();}
    try{await put("items",rec); if(newPhoto) await put("photos",newPhoto,"i:"+id);}catch(_){return toast("Couldn't save. Is your phone storage full?");}
    const isNew=!items.has(id); items.set(id,rec);
    if(view!=="b:"+binderId) setView("b:"+binderId); else {renderGens();render();}
    showItem(id); toast(isNew?`Added ${rec.cardName} to ${b.name}`:"Saved");
    if(isNew){const d=dexNums[0];const cols=[...(d?typesOf(d).map(t=>TYPE_COL[t]):[b.color]),"#e2b04e","#f3cf7e","#ffffff"];
      const n=itemsIn(binderId).length; confetti(cols,n%9===0); if(n%9===0) setTimeout(()=>toast(`Page ${n/9} of ${b.name} is full!`),300);
      const pk=document.querySelector(`.pocket[data-item="${id}"]`); if(pk){pk.classList.add("pop");pk.addEventListener("animationend",()=>pk.classList.remove("pop"),{once:true});}}
  });
}

/* ---------- stats & backup ---------- */
$("#statsBtn").addEventListener("click",()=>{pushSheet();showStats();});
function showStats(){
  const all=[...entries.values()];
  const paidList=all.filter(e=>e.price!=null), valued=all.filter(e=>valueOf(e)!=null), both=all.filter(e=>e.price!=null&&valueOf(e)!=null);
  const sum=(l,f)=>Math.round(l.reduce((s,e)=>s+f(e),0)*100)/100;
  const spent=sum(paidList,e=>e.price), worth=sum(valued,valueOf);
  const bPaid=sum(both,e=>e.price), bVal=sum(both,valueOf);
  const top=[...valued].sort((a,b)=>valueOf(b)-valueOf(a))[0];
  const noVal=all.length-valued.length;
  const counts=Array(9).fill(0); all.forEach(e=>counts[genOf(e.dex)]++);
  const rows=ROMAN.map((r,i)=>{const t=(i<8?GEN_START[i+1]:1026)-GEN_START[i];return `<div class="genrow"><span>Gen ${r}</span><div class="bar2"><i style="width:${counts[i]/t*100}%"></i></div><span>${counts[i]}/${t} · ${Math.round(counts[i]/t*100)}%</span></div>`;}).join("");
  const lb=settings.lastBackup?new Date(settings.lastBackup).toLocaleDateString():"never";
  const pu=settings.pricesUpdated?new Date(settings.pricesUpdated).toLocaleString():"not yet";
  openSheet(`<div class="sheet-head" id="statsMark"><h2 id="sheetTitle"><small>COLLECTION</small>Stats &amp; backup</h2>${closeBtn}</div><div class="sheet-body">
    <div class="stat-tiles">
      <div class="tile"><b>${(entries.size/1025*100).toFixed(1)}%</b><span>${entries.size} of 1025 filled</span></div>
      <div class="tile"><b>${money(spent)}</b><span>total paid</span></div>
      <div class="tile"><b>${money(worth)}</b><span>National Dex value</span></div>
      <div class="tile"><b>${both.length?gainHtml(bPaid,bVal):"—"}</b><span>gain/loss</span></div>
    </div>
    <p class="note">${both.length?`Gain/loss compares the ${both.length} card${both.length===1?" that has":"s that have"} both a price paid and a value. `:""}${noVal?`${noVal} card${noVal===1?" has":"s have"} no value yet; add "My value" to include ${noVal===1?"it":"them"}. `:""}${top?`Most valuable: #${top.dex} ${esc(SPECIES[top.dex-1][0])}, ${esc(top.set)} ${esc(top.number)} at ${money(valueOf(top))}.`:""}</p>
    <div class="label">Market prices</div>
    <p class="note">TCGplayer market prices in USD, converted at 1 USD = RM ${rate()?rate().toFixed(4):"—"}${settings.rateOverride?" (your rate)":settings.rateUpdated?` (live, ${new Date(settings.rateUpdated).toLocaleDateString()})`:""}. Last updated: ${pu}. Prices refresh by themselves once a day when you open the app.</p>
    <div class="row"><button class="btn" data-act="refresh">${refreshing?"Updating…":"Update prices now"}</button></div>
    <div class="field"><label class="label" for="rto">Fixed USD→RM rate</label><input id="rto" type="number" inputmode="decimal" step="0.0001" min="0" placeholder="Blank = live rate" value="${settings.rateOverride??""}"></div>
    <div class="label">By generation</div>${rows}
    ${binders.size?`<div class="label">My binders</div>${(()=>{const allT=totals([...entries.values(),...items.values()]);const rowsB=[["National Dex",[...entries.values()]],...[...binders.values()].map(b=>[b.name,itemsIn(b.id)])].map(([n,l])=>{const t=totals(l);return `<div class="genrow" style="grid-template-columns:minmax(0,1fr) auto auto"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span style="font-family:var(--f-mono);font-size:12.5px">${l.length} · ${short(t.worth)}</span><span>${t.both?gainHtml(t.bPaid,t.bVal).replace(/ \([^)]*\)/,""):"—"}</span></div>`;}).join("");return rowsB+`<p class="note">All binders: ${money(allT.paid)} paid, ${money(allT.worth)} value${allT.both?`, ${gainHtml(allT.bPaid,allT.bVal)}`:""}.</p>`;})()}`:""}
    <div class="label">Appearance</div>
    <div class="seg3" role="group" aria-label="Appearance">${["auto","light","dark"].map(t=>`<button data-theme-pick="${t}" aria-pressed="${(settings.theme||"auto")===t}">${t==="auto"?"Auto":t==="light"?"Light":"Dark"}</button>`).join("")}</div>
    <div class="label">Backup</div>
    <p class="note">Everything is stored only on this phone. Last backup: ${lb}. A backup file includes your photos.</p>
    <div class="row"><button class="btn primary" data-act="export">Save backup file</button><button class="btn" data-act="import">Restore from file</button></div>
    <div id="imp"></div>
  </div>`);
  $("#rto").addEventListener("change",async ev=>{const v=ev.target.value;settings.rateOverride=v===""?null:parseFloat(v);await put("meta",settings,"settings");showStats();});
  $("#sheet").onclick=async ev=>{const tp=ev.target.closest("[data-theme-pick]");
    if(tp){settings.theme=tp.dataset.themePick;applyTheme(settings.theme);document.querySelectorAll("[data-theme-pick]").forEach(b=>b.setAttribute("aria-pressed",b===tp));try{await put("meta",settings,"settings");}catch(_){}return;}
    const a=ev.target.closest("[data-act]");if(!a)return;
    if(a.dataset.act==="close") closeSheet();
    if(a.dataset.act==="refresh"&&!refreshing){a.textContent="Updating…";refreshPrices(true);}
    if(a.dataset.act==="export") exportBackup();
    if(a.dataset.act==="import") $("#restoreFile").click();
    if(a.dataset.act==="cancelimp") $("#imp").innerHTML="";
    if(a.dataset.act==="doimp") doRestore();
  };
}
const toB64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
async function exportBackup(){
  toast("Preparing backup…");
  const photos=await getAllKV("photos"); const p={};
  for(const k in photos) p[k]=await toB64(photos[k]);
  const data={app:"dex-binder",version:2,exported:new Date().toISOString(),settings,entries:[...entries.values()],binders:[...binders.values()],items:[...items.values()],photos:p};
  const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
  const name=`dex-binder-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([blob],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:"Dex Binder backup"});
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
    settings.lastBackup=Date.now(); await put("meta",settings,"settings"); toast("Backup saved");
  }catch(e){ if(e&&e.name!=="AbortError") toast("Backup was not saved."); }
}
let pending=null;
$("#restoreFile").addEventListener("change",async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;
  try{ const d=JSON.parse(await f.text()); if(d.app!=="dex-binder"||!Array.isArray(d.entries)) throw 0; pending=d;
    $("#imp").innerHTML=`<div class="confirm"><p>Replace everything on this phone with the backup from ${new Date(d.exported).toLocaleDateString()} (${d.entries.length} Dex cards${d.binders&&d.binders.length?`, ${d.binders.length} binders with ${(d.items||[]).length} cards`:""})?</p><button class="btn" data-act="cancelimp">Cancel</button><button class="btn primary" data-act="doimp">Restore</button></div>`;
  }catch(_){ toast("That file isn't a Dex Binder backup."); }});
async function doRestore(){ const d=pending; if(!d) return;
  try{
    for(const st of ["entries","photos","binders","items"]) await tx(st,"readwrite",s=>s.clear());
    for(const e of d.entries) await put("entries",e);
    for(const b of d.binders||[]) await put("binders",b);
    for(const i of d.items||[]) await put("items",i);
    for(const k in d.photos){ const b=await (await fetch(d.photos[k])).blob(); await put("photos",b,/^\d+$/.test(k)?+k:k); }
    if(d.settings) { settings={...settings,...d.settings}; await put("meta",settings,"settings"); }
    entries=new Map(d.entries.map(e=>[e.dex,e])); binders=new Map((d.binders||[]).map(b=>[b.id,b])); items=new Map((d.items||[]).map(i=>[i.id,i]));
    if(view.startsWith("b:")&&!binders.has(view.slice(2))) view="shelf"; setView(view,true); showStats(); toast(`Restored ${d.entries.length} cards`);
  }catch(_){ toast("Restore failed partway. Try the file again."); }
}

let tt; function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}

if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
load();
</script>
